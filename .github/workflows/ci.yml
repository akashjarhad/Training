name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run Ruff linting
      run: |
        cd Training
        ruff check . --output-format=github
    
    - name: Check formatting
      run: |
        cd Training
        ruff format --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd Training
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run pytest
      env:
        LLM_MOCK: "1"
      run: |
        cd Training
        python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: Training/test-results.xml
    
    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: Training/test-results.xml
        reporter: java-junit

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API image
      run: |
        cd Training
        docker build -f Dockerfile -t aapleseva-api:test .
    
    - name: Build UI image
      run: |
        cd Training
        docker build -f Dockerfile.ui -t aapleseva-ui:test .
    
    - name: Test API container
      run: |
        cd Training
        docker run -d --name api-test -p 8000:8000 \
          -e LLM_MOCK=1 \
          aapleseva-api:test
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop api-test
    
    - name: Test UI container
      run: |
        cd Training
        docker run -d --name ui-test -p 8501:8501 \
          -e API_BASE_URL=http://localhost:8000 \
          aapleseva-ui:test
        sleep 15
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop ui-test

  build-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.docker.result }}" != "success" ]; then
          echo "❌ CI checks failed"
          exit 1
        fi
        echo "✅ All CI checks passed"
