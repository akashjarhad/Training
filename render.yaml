# Render Blueprint
# Deploy AapleSeva API and UI to Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: aapleseva-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    env: python
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MOCK
        value: "0"
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard (Environment tab)
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true

  # Streamlit UI
  - type: web
    name: aapleseva-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    plan: free
    env: python
    envVars:
      - key: API_BASE_URL
        fromService:
          name: aapleseva-api
          type: web
          property: hostUrl
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
